[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/File()/Form() in argument defaults are idiomatic.
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form"]

[tool.coverage.run]
source = ["app"]
branch = true
# SQLAlchemy's async layer runs on greenlets; without this, coverage misses code after `await`.
concurrency = ["greenlet", "thread"]
