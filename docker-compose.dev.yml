services:
  db:
    image: postgres:16-alpine
    restart: always
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: always
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - uploads:/app/uploads
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    volumes:
      - ./frontend/public/html/index.html:/usr/share/nginx/html/index.html
      - ./frontend/public/html/download.html:/usr/share/nginx/html/download.html
      - ./frontend/public/css:/usr/share/nginx/html/css
      - ./frontend/public/js:/usr/share/nginx/html/js
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf

volumes:
  pgdata:
  uploads:
