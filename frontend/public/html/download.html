<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Скачать файл — m3wory.site</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/css/style.css" rel="stylesheet" />
</head>
<body>
<div class="py-5">
  <div class="container" style="max-width: 500px; margin-top: 4rem;">

    <a href="/" class="brand" aria-label="m3wory.site">
      <img src="/img/logo.svg" alt="" class="brand-mark" width="48" height="48" />
      <span class="brand-text">m3wory<span class="brand-tld">.site</span></span>
    </a>

    <div class="card mb-4" id="main-card">
      <div class="card-body p-4">
        <div class="text-center py-5" id="state-loading">
          <div class="spinner-border icon-accent mb-3" role="status" style="width: 3rem; height: 3rem; border-width: 0.25rem;">
            <span class="visually-hidden">Загрузка...</span>
          </div>
          <div class="text-muted fw-medium">Получаем информацию о файле…</div>
        </div>

        <div id="state-file" style="display:none;">
          <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center bg-light rounded-circle mb-3" style="width: 80px; height: 80px;">
              <i data-lucide="package" class="icon-accent" style="width: 40px; height: 40px;"></i>
            </div>
            <h4 class="fw-bold mb-2 text-break" id="file-name">—</h4>
          </div>

          <div class="d-flex flex-column gap-2 mb-4" id="meta-row"></div>

          <div class="alert alert-warning py-3 px-3 small d-none border-0 mb-4 d-flex align-items-center gap-2" id="warning-box">
            <i data-lucide="alert-circle" style="width: 18px; height: 18px;"></i>
            <span id="warning-text"></span>
          </div>

          <button class="btn btn-primary w-100 py-3" id="btn-download">
            <span class="d-flex align-items-center justify-content-center gap-2">
              <i data-lucide="download"></i>
              Скачать файл
            </span>
          </button>
        </div>

        <div class="text-center py-5" id="state-error" style="display:none;">
          <div class="mb-3 text-danger" id="err-icon-wrap">
            <i data-lucide="x-circle" style="width: 64px; height: 64px;"></i>
          </div>
          <h4 class="fw-bold mb-2" id="err-title">Файл не найден</h4>
          <p class="text-muted small mb-0" id="err-sub">
            Возможно, срок хранения истёк или ссылка недействительна.
          </p>
        </div>
      </div>
    </div>

    <div class="text-center">
      <a href="/" class="text-decoration-none text-muted small d-inline-flex align-items-center gap-1">
        <i data-lucide="arrow-left" style="width: 14px; height: 14px;"></i>
        Загрузить свой файл
      </a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/lib/lucide.min.js"></script>
<script src="/js/download.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    if (typeof lucide !== 'undefined') {
      lucide.createIcons();
    }
  });
</script>
</body>
</html>
