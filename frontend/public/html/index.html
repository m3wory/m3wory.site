<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>m3wory.site</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/css/style.css" rel="stylesheet" />
</head>

<body>
  <div class="py-5">
    <div class="container" style="max-width: 540px; margin-top: 4rem;">

      <div class="card mb-4" id="upload-card">
        <div class="card-body p-4">
          <h5 class="card-title mb-4 fw-bold">Загрузить файл</h5>

          <div id="drop-zone" class="mb-4 border rounded p-5 text-center position-relative">
            <input type="file" id="file-input" class="position-absolute top-0 start-0 w-100 h-100 opacity-0"
              style="cursor: pointer;" />
            <i data-lucide="folder-up" class="mb-3 icon-lg"></i>
            <div class="fw-bold fs-5">Перетащите файл сюда</div>
            <div class="small text-muted mt-2">или нажмите для выбора (макс. 100 МБ)</div>
          </div>

          <div id="file-selected" class="mb-4 gap-3 p-3 rounded">
            <div class="bg-light p-3 rounded d-flex align-items-center justify-content-center">
              <i data-lucide="file" class="icon-accent" style="width: 32px; height: 32px;"></i>
            </div>
            <div class="flex-grow-1 overflow-hidden">
              <div class="fw-bold text-nowrap text-truncate" id="sel-name">—</div>
              <div class="small text-muted" id="sel-size">—</div>
            </div>
            <button class="btn btn-sm btn-link text-decoration-none text-muted p-0 d-flex align-items-center gap-1"
              onclick="resetForm()">
              <i data-lucide="trash-2" style="width: 14px; height: 14px;"></i>
              Удалить
            </button>
          </div>

          <div class="row g-3 mb-4">
            <div class="col-6">
              <label class="form-label small fw-bold text-muted text-uppercase">Срок хранения</label>
              <select class="form-select border-0 bg-light" id="expires-hours">
                <option value="1">1 час</option>
                <option value="6">6 часов</option>
                <option value="24" selected>24 часа</option>
                <option value="72">3 дня</option>
                <option value="168">7 дней</option>
                <option value="720">30 дней</option>
                <option value="0">Без ограничений</option>
              </select>
            </div>
            <div class="col-6">
              <label class="form-label small fw-bold text-muted text-uppercase">Скачиваний</label>
              <select class="form-select border-0 bg-light" id="max-downloads">
                <option value="0" selected>Без ограничений</option>
                <option value="1">1 раз</option>
                <option value="3">3 раза</option>
                <option value="10">10 раз</option>
                <option value="50">50 раз</option>
                <option value="100">100 раз</option>
              </select>
            </div>
          </div>

          <div class="alert alert-danger d-none mb-3 py-2 px-3 small border-0" id="error-box"></div>

          <div class="progress mb-4 d-none" id="progress-wrap">
            <div class="progress-bar" id="progress-bar" style="width:0%"></div>
          </div>

          <button class="btn btn-primary w-100 py-3" id="btn-upload" disabled>
            <span class="d-flex align-items-center justify-content-center gap-2">
              <i data-lucide="upload-cloud"></i>
              Загрузить сейчас
            </span>
          </button>
        </div>
      </div>

      <div class="card border-0" id="result-card" style="display:none; background: transparent; box-shadow: none;">
        <div class="card-body p-0">
          <div class="text-center mb-4">
            <i data-lucide="sparkles" class="success-indicator mx-auto" style="width: 56px; height: 56px;"></i>
            <h4 class="fw-bold mb-1">Файл успешно загружен!</h4>
            <p class="text-muted small">Ссылка будет доступна согласно настройкам.</p>
          </div>

          <div class="bg-white p-4 rounded card mb-4 shadow-sm border-0">
            <label class="text-uppercase small fw-bold text-muted mb-2 d-block">Ссылка для скачивания</label>
            <div class="d-flex align-items-center gap-2 p-1 border rounded bg-light mb-3">
              <div class="flex-grow-1 small text-break px-3" id="result-link">—</div>
              <button class="btn btn-white btn-sm border shadow-sm" id="btn-copy" onclick="copyLink()">
                Копировать
              </button>
            </div>

            <div id="qr-wrap" class="d-flex flex-column align-items-center gap-3 p-3 border rounded bg-light" style="display: none;">
              <div id="qr-code"></div>
              <button class="btn btn-sm btn-outline-primary d-flex align-items-center gap-2" onclick="downloadQR()">
                <i data-lucide="download" style="width: 14px; height: 14px;"></i>
                Скачать QR-код
              </button>
            </div>
          </div>

          <div class="d-flex flex-wrap gap-2 mb-4 justify-content-center" id="result-badges"></div>

          <div class="text-center">
            <button class="btn btn-link text-decoration-none text-muted small" onclick="resetForm()">
              <i data-lucide="rotate-ccw" class="lucide me-1" style="width: 16px; height: 16px;"></i>
              Загрузить другой файл
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/lib/lucide.min.js"></script>
  <script src="/js/lib/qrcode.min.js"></script>
  <script src="/js/index.js"></script>
  <script>
    // Initial icons
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof lucide !== 'undefined') {
        lucide.createIcons();
      }
    });
  </script>
</body>

</html>
